<sly data-sly-use.template="core/wcm/components/commons/v1/templates.html"></sly>
<div class="cq-placeholder" data-emptytext="${component.title @ context='attribute'}" data-sly-test="${wcmmode.edit}"></div>
<a  class='author-v3 author-v3--long-variation' data-component_type="$<div class="author-v3__icon-container" data-sly-test="${properties.componentType}" data-component_id="${properties.componentId}" data-component_title="${properties.componentTitle}" data-click_category="${properties.clickCategory}" data-click_id="${properties.clickId}" data-click_name="${properties.clickName}" data-click_title="${properties.clickTitle}" href="${properties.linkUrl}">
      ${properties.src}">
          <div class="author-v3__icon-inner">
            <img alt="${properties.alt}" src="${properties.src}" />
          </div>
        </div>
      <div class="author-v3__text-container">
        <div class="author-v3__name" data-sly-test="${[properties.firstName,properties.lastName] @ join=' ', context='html'}">${[properties.firstName,properties.lastName] @ join=' ', context='html'}</div>
        <div class="author-v3__title" data-sly-test="${properties.authorTitle}">${properties.authorTitle}</div>
        <div class="author-v3__content" data-sly-test="${properties.description}">${properties.description}</div>
      </div>
    </a>
<sly data-sly-call="${template.placeholder @ isEmpty=false}"></sly>
