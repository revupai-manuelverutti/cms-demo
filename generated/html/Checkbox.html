<sly data-sly-use.template="core/wcm/components/commons/v1/templates.html"></sly>
<div class="cq-placeholder" data-emptytext="${component.title @ context='attribute'}" data-sly-test="${wcmmode.edit}"></div>
<label class="flex items-center cursor-pointer">
      <input
        type="checkbox"
        checked=<svg class="w-3 h-3 text-white" fill="currentColor" viewBox="0 0 20 20" data-sly-test="${isChecked}
        properties.onChange=${handleChange}
        class="sr-only"
      />
      <div class="flex items-center justify-center w-5 h-5 border-2 border-gray-300 rounded bg-white transition-all duration-200">
        ${isChecked}">
            <path fillRule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clipRule="evenodd" />
          </svg>
      </div>
      <span class="ml-2 text-sm text-gray-700 font-sans select-none">
        ${properties.label}
      </span>
    </label>
<sly data-sly-call="${template.placeholder @ isEmpty=false}"></sly>
