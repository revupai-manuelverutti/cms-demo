<sly data-sly-use.template="core/wcm/components/commons/v1/templates.html"></sly>
<div class="cq-placeholder" data-emptytext="${component.title @ context='attribute'}" data-sly-test="${wcmmode.edit}"></div>
<form onSubmit="${handleSubmit}" class="relative">
      <div class="relative">
        <input
          type="text"
          value="${query}"
          onChange="${(e) => setQuery(e.target.value)}"
          placeholder="${properties.placeholder}"
          class="w-full px-4 py-2 pl-10 pr-4 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200 text-gray-900 placeholder-gray-500"
        />
        <Search class="absolute left-3 top-1/2 transform -translate-y-1/2 h-5 w-5 text-gray-400" />
      </div>
    </form>
<sly data-sly-call="${template.placeholder @ isEmpty=false}"></sly>
